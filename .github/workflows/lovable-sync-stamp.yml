# Обновляет public/lovable-sync.json на каждый push в main —
# в Lovable после Git-sync видно, что подтянулась новая версия.
name: Lovable sync stamp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stamp:
    if: "!contains(github.event.head_commit.message, '[lovable-stamp]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write lovable-sync.json
        env:
          SHA: ${{ github.sha }}
          TS: ${{ github.event.head_commit.timestamp }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SHORT="${SHA:0:7}"
          jq -n \
            --arg sha "$SHORT" \
            --arg full "$SHA" \
            --arg ts "$TS" \
            --arg label "$(echo "$MSG" | head -1)" \
            '{
              git_sha: $sha,
              git_sha_full: $full,
              updated_at: $ts,
              label: $label,
              publish_hint: "Lovable → Publish (справа вверху) → Update"
            }' > public/lovable-sync.json

      - name: Commit stamp if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/lovable-sync.json
          if git diff --staged --quiet; then
            echo "No stamp change"
            exit 0
          fi
          git commit -m "chore: lovable sync stamp ${GITHUB_SHA:0:7} [lovable-stamp]"
          git push
