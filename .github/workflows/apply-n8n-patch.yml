name: Set WhatsApp templates in client_configs

# Updates wa_welcome_message_template / wa_customer_greeting_template
# in the n8n production Supabase for the MarkVision client_configs row.
#
# Trigger: manual only. To re-run, add repo secret SUPABASE_SERVICE_KEY
# (service_role JWT for szfgdruhlebfvcmlvxdk) and click "Run workflow".

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: 'Force client_configs cabinet_id (optional, uses regex match otherwise)'
        required: false
        type: string
      dry_run:
        description: 'List rows without writing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set templates
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_CLIENT_ID: ${{ inputs.target_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_KEY secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          mkdir -p .github/ci-state
          { echo "=== run at $(date -u) on $GITHUB_SHA ==="; node scripts/set-whatsapp-templates.mjs 2>&1; echo "EXIT=$?"; } | tee .github/ci-state/last-run.log
      - name: Commit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/ci-state/last-run.log || true
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "ci: log [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
