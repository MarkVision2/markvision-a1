# One-off: dump recent heygen/montage/reels jobs for MarkVision AI project.
# Uses SUPABASE_ACCESS_TOKEN → project API keys → service_role REST.
name: Diagnose HeyGen queue

on:
  workflow_dispatch: {}
  push:
    branches:
      - cursor/diagnose-heygen-queue-84cc
    paths:
      - ".github/workflows/diagnose-heygen-queue.yml"
      - "scripts/diagnose-heygen-queue.py"

concurrency:
  group: diagnose-heygen-queue
  cancel-in-progress: true

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'szfgdruhlebfvcmlvxdk' }}
  PROJECT_ID: cceb9a86-687b-4417-9b4e-d106bd8cc79c

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify access token
        run: test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::SUPABASE_ACCESS_TOKEN missing"; exit 1)

      - name: Query queues via service role
        run: python3 scripts/diagnose-heygen-queue.py

      - name: Upload dump
        uses: actions/upload-artifact@v4
        with:
          name: heygen-queue-dump
          path: /tmp/diag-out
          retention-days: 3
          if-no-files-found: warn
