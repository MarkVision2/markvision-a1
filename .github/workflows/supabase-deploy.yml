name: Deploy Supabase (migrations + functions)

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/*.sql"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'szfgdruhlebfvcmlvxdk' }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so github.event.before is resolvable after squash merges.
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.20.5

      # Функции деплоятся только по ACCESS_TOKEN + project ref (без пароля БД).
      # Пароль нужен только для db push, поэтому его отсутствие не должно блокировать
      # деплой функций — иначе весь бэкенд не выкатывается из-за одного секрета.
      - name: Verify access token
        run: test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Secret SUPABASE_ACCESS_TOKEN is missing"; exit 1)

      - name: Normalize project ref
        id: ref
        run: bash .github/scripts/normalize-supabase-ref.sh

      - name: Detect database SQL changes
        id: db_changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi

          # Shallow/race after concurrent merges: before SHA may not exist locally.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::Base commit $BASE missing locally; treating SQL as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Сам воркфлоу в списке намеренно: если менялась логика применения
          # миграций, её надо прогнать по проду в этом же деплое, а не ждать
          # следующего изменения SQL, чтобы узнать, что она не работает.
          if git diff --name-only "$BASE" "$GITHUB_SHA" -- \
            'supabase/migrations/**/*.sql' \
            'supabase/migrations/*.sql' \
            'supabase/migrations_client_config/**/*.sql' \
            'supabase/migrations_client_config/*.sql' \
            'scripts/*.sql' \
            '.github/workflows/supabase-deploy.yml' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 0) Номера версий миграций должны быть уникальны. CLI хранит историю по
      #    номеру версии, поэтому из двух файлов с одинаковым номером второй не
      #    может быть записан никогда: он вечно висит в плане push и блокирует
      #    применение всего остального. Ловим это сразу, а не на проде.
      - name: Check migration versions are unique
        run: |
          DUPES=$(ls supabase/migrations/*.sql 2>/dev/null | sed 's#.*/##' | cut -c1-14 | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Одинаковые номера версий у разных файлов миграций:"
            for v in $DUPES; do ls -1 supabase/migrations/${v}_*.sql; done
            echo "::error::Переименуйте лишние файлы на свободные номера."
            exit 1
          fi
          echo "::notice::Migration versions are unique."

      # 1) Edge functions — сначала и всегда (не зависят от пароля БД).
      #    Одна упавшая функция не роняет остальные и НЕ блокирует SQL ниже:
      #    раньше exit 1 здесь пропускал миграции (dm_button_title и т.п.).
      - name: Deploy edge functions
        id: functions
        continue-on-error: true
        env:
          SUPABASE_PROJECT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          FUNCS=$(ls supabase/functions | grep -v '^_' | tr '\n' ' ')
          echo "Deploying: $FUNCS"
          FAILED=""
          for fn in $FUNCS; do
            echo "::group::Deploying $fn"
            if ! supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "::warning::Failed to deploy $fn"
              FAILED="$FAILED $fn"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
            echo "::error::Some functions failed to deploy:$FAILED"
            exit 1
          fi
          echo "failed=" >> "$GITHUB_OUTPUT"

      # 2) Миграции БД — через db push если есть пароль.
      #    КРИТИЧНО: шаг идёт даже если functions упали (колонки вроде dm_button_title).
      - name: Apply database migrations
        id: db_push
        if: ${{ always() && steps.db_changes.outputs.changed == 'true' && env.SUPABASE_DB_PASSWORD != '' }}
        continue-on-error: true
        env:
          SUPABASE_PROJECT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

          PLAN=/tmp/db-push-plan.txt
          dry_run() {
            supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" > "$PLAN" 2>&1 || true
            cat "$PLAN"
          }

          echo "::group::db push --dry-run"
          dry_run
          echo "::endgroup::"

          # История миграций на проде расходится с репозиторием: часть миграций
          # применяется мимо CLI (Lovable), их версии оседают в
          # supabase_migrations.schema_migrations, а файлов в supabase/migrations нет.
          # В таком состоянии db push отказывается работать целиком
          # ("Remote migration versions not found in local migrations directory")
          # и не применяет НИ ОДНОЙ миграции. Помечаем такие версии как reverted —
          # это правка только служебной таблицы учёта, схема БД не трогается.
          # Список версий берём из самой ошибки: CLI печатает готовую команду
          # ремонта. Это надёжнее разбора таблицы migration list, формат которой
          # зависит от версии CLI.
          if grep -q "Remote migration versions not found" "$PLAN"; then
            ORPHANS=$(grep -o 'supabase migration repair --status reverted.*' "$PLAN" \
              | head -1 | grep -oE '[0-9]{14}' | tr '\n' ' ')
            if [ -z "$ORPHANS" ]; then
              echo "::error::История миграций расходится, но список версий из вывода CLI не разобрался — см. лог выше."
              exit 1
            fi
            # shellcheck disable=SC2086
            echo "::notice::Repairing $(echo $ORPHANS | wc -w) remote-only migration versions as reverted"
            # shellcheck disable=SC2086
            supabase migration repair --status reverted --password "$SUPABASE_DB_PASSWORD" $ORPHANS
            echo "::group::db push --dry-run (после ремонта истории)"
            dry_run
            echo "::endgroup::"
            if grep -q "Remote migration versions not found" "$PLAN"; then
              echo "::error::История миграций всё ещё расходится после ремонта. Ничего не применено."
              exit 1
            fi
          fi

          # Обратная сторона того же расхождения: часть локальных миграций уже
          # применена к проду мимо CLI и в учёте не записана. db push видит их как
          # неприменённые и либо требует --include-all, либо прогнал бы их по проду
          # заново. Помечаем как applied только те версии, что перечислены в
          # supabase/migrations_baseline_applied.txt — там же написано, как каждая
          # из них проверялась на проде. Незнакомая версия останавливает деплой:
          # молча пропустить непроверенную миграцию хуже, чем не выкатиться.
          BASELINE=supabase/migrations_baseline_applied.txt
          RUNNABLE_FILE=supabase/migrations_out_of_order_ok.txt
          VETTED=$(grep -E '^[0-9]{14}$' "$BASELINE" | sort -u)
          RUNNABLE=$(grep -E '^[0-9]{14}$' "$RUNNABLE_FILE" | sort -u)
          BOTH=$(comm -12 <(echo "$VETTED") <(echo "$RUNNABLE"))
          if [ -n "$BOTH" ]; then
            echo "::error::Версия не может быть одновременно в $BASELINE и $RUNNABLE_FILE: $BOTH"
            exit 1
          fi
          PUSH_FLAGS=""
          plan_versions() { grep -oE '[0-9]{14}_[^ ]*\.sql' "$PLAN" | cut -c1-14 | sort -u; }
          # Помечаем по одной версии, а не пачкой: CLI перечисляет все локальные
          # файлы раньше последней записи в учёте, включая уже записанные, и на
          # первой такой пачка падает целиком с duplicate key. Строка уже в учёте —
          # это и есть нужное состояние, поэтому такую ошибку пропускаем.
          mark_applied() { # $1 — версии через пробел
            local v out marked=0 already=0
            echo "::group::migration repair --status applied"
            for v in $1; do
              if out=$(supabase migration repair --status applied --password "$SUPABASE_DB_PASSWORD" "$v" 2>&1); then
                marked=$((marked + 1))
              elif echo "$out" | grep -q 'duplicate key value violates unique constraint'; then
                already=$((already + 1))
              else
                echo "$out"
                echo "::endgroup::"
                echo "::error::Не удалось пометить миграцию $v как applied. Ничего больше не применяется."
                return 1
              fi
            done
            echo "::endgroup::"
            echo "::notice::Baseline: помечено $marked, уже было в учёте $already"
            echo "::group::db push --dry-run (после базовой линии)"
            dry_run
            echo "::endgroup::"
          }

          # Файлы, датированные раньше последней записи в учёте. Обычным push их не
          # применить: CLI требует --include-all и правильно делает — применить их
          # молча значит выполнить по проду произвольный старый SQL.
          # Сначала выносим из этого списка те, что уже на проде: их надо только
          # записать в учёт, выполнять нельзя.
          if grep -q "Rerun the command with --include-all" "$PLAN"; then
            BASE_PART=$(comm -12 <(plan_versions) <(echo "$VETTED") | tr '\n' ' ')
            if [ -n "${BASE_PART// /}" ]; then
              mark_applied "$BASE_PART"
            fi
          fi

          # Что осталось out-of-order — придётся выполнить. Разрешено только то,
          # что человек внёс в список безопасных для повторного прогона.
          # Незнакомая версия останавливает деплой.
          if grep -q "Rerun the command with --include-all" "$PLAN"; then
            REST=$(plan_versions)
            UNKNOWN=$(comm -23 <(echo "$REST") <(echo "$RUNNABLE"))
            if [ -n "$UNKNOWN" ]; then
              echo "::error::Эти миграции датированы раньше последней записи в учёте прода и не разрешены ни к пометке, ни к применению:"
              echo "$UNKNOWN"
              echo "::error::Ничего не применено. Если они уже на проде — впишите их в $BASELINE; если их надо выполнить и они безопасны при повторе — в $RUNNABLE_FILE; иначе перевыпустите с более поздней датой."
              exit 1
            fi
            # shellcheck disable=SC2086
            echo "::notice::Applying $(echo $REST | wc -w) out-of-order migrations from $RUNNABLE_FILE"
            PUSH_FLAGS="--include-all"
          fi

          # Остаток обычного плана: то, что push применил бы вперёд. Здесь незнакомая
          # версия — нормальная новая миграция, её и надо применить. А вот версии из
          # базовой линии применять нельзя: они уже на проде, повтор их сломает.
          if [ -z "$PUSH_FLAGS" ]; then
            KNOWN=$(comm -12 <(plan_versions) <(echo "$VETTED") | tr '\n' ' ')
            if [ -n "${KNOWN// /}" ]; then
              mark_applied "$KNOWN"
            fi
          fi

          # Предохранитель на размер плана: если после ремонта учёта push всё равно
          # хочет применить много миграций, НЕ применяем ничего — такой хвост
          # должен посмотреть человек, а не выкатиться сам ночью.
          PENDING=$(grep -cE '[0-9]{14}_.*\.sql' "$PLAN" || true)
          echo "::notice::Pending migrations: $PENDING"
          if [ "$PENDING" -gt "${DB_PUSH_MAX_PENDING:-10}" ]; then
            echo "::error::db push хочет применить $PENDING миграций — это похоже на накопившийся хвост, а не на текущий деплой. Ничего не применено. Проверьте список выше и примените осознанно (или поднимите DB_PUSH_MAX_PENDING)."
            exit 1
          fi

          # shellcheck disable=SC2086
          supabase db push $PUSH_FLAGS --password "$SUPABASE_DB_PASSWORD"

      # 2b) Fallback на случай, если секрет SUPABASE_DB_PASSWORD не задан.
      #     Наблюдалось, что этот путь отвечает HTTP 403 (error code 1010) —
      #     ответ Cloudflare, не Supabase; причина не подтверждена (либо у токена
      #     нет database_write, либо запрос режется по client signature: скрипт
      #     ходит через python urllib без User-Agent). Пока путь ненадёжен,
      #     каждый набор миграций дублируется идемпотентным файлом
      #     scripts/apply-*.sql для ручной вставки в Supabase SQL Editor.
      #     Основной путь — db push выше, он требует только SUPABASE_DB_PASSWORD.
      - name: Apply critical SQL via Management API
        if: ${{ always() && steps.db_changes.outputs.changed == 'true' && env.SUPABASE_DB_PASSWORD == '' }}
        continue-on-error: true
        id: mgmt_sql
        env:
          SUPABASE_PROJECT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          chmod +x .github/scripts/apply-sql-via-management-api.sh
          FAILED=""
          for SQL_FILE in \
            scripts/apply-prod-pending-20260719.sql \
            scripts/apply-prod-cabinets-client-configs.sql \
            scripts/apply-ad-cabinets-project-member-write.sql \
            scripts/apply-client-configs-yurcha-sync.sql \
            scripts/apply-fix-project-delete-leads-pipeline-fk.sql \
            supabase/migrations/20260719190000_ig_dm_button_title.sql \
            supabase/migrations/20260719193000_montage_jobs_broll_source.sql \
            supabase/migrations/20260823120000_wa_web_block_greenapi_fix.sql \
            scripts/apply-wa-web-greenapi-fix.sql \
            scripts/apply-ads-native-launch.sql
          do
            echo "::group::Apply $SQL_FILE"
            if ! SQL_FILE="$SQL_FILE" .github/scripts/apply-sql-via-management-api.sh; then
              echo "::warning::Failed to apply $SQL_FILE"
              FAILED="$FAILED $SQL_FILE"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::warning::Some SQL files were not applied:$FAILED"
            exit 1
          fi

      - name: Note about DB migration status
        if: ${{ always() }}
        run: |
          if [ "${{ steps.db_changes.outputs.changed }}" != "true" ]; then
            echo "::notice::No database SQL changes in this push."
          elif [ "${{ steps.db_push.outcome }}" = "success" ] || [ "${{ steps.mgmt_sql.outcome }}" = "success" ]; then
            echo "::notice::Database SQL applied."
          else
            echo "::warning::Could not apply DB migration automatically. Check the 'Apply database migrations' step log; as a fallback apply the matching scripts/apply-*.sql in Supabase SQL Editor."
          fi

      - name: Fail if functions or SQL did not succeed
        if: ${{ always() }}
        run: |
          FAIL=0
          if [ "${{ steps.functions.outcome }}" != "success" ]; then
            echo "::error::Edge function deploy had failures:${{ steps.functions.outputs.failed }}"
            FAIL=1
          fi
          SQL_OK=0
          if [ "${{ steps.db_changes.outputs.changed }}" != "true" ] || [ "${{ steps.db_push.outcome }}" = "success" ] || [ "${{ steps.mgmt_sql.outcome }}" = "success" ]; then
            SQL_OK=1
          fi
          # SQL is required only when SQL files changed or the workflow was started manually.
          if [ "$SQL_OK" != "1" ]; then
            echo "::error::Database migration did not apply."
            FAIL=1
          fi
          exit $FAIL

# redeploy trigger: dm_button_title must apply even when some functions fail
# retry after owner-token update
