name: Deploy Supabase (migrations + functions)

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/*.sql"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'szfgdruhlebfvcmlvxdk' }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so github.event.before is resolvable after squash merges.
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.20.5

      # Функции деплоятся только по ACCESS_TOKEN + project ref (без пароля БД).
      # Пароль нужен только для db push, поэтому его отсутствие не должно блокировать
      # деплой функций — иначе весь бэкенд не выкатывается из-за одного секрета.
      - name: Verify access token
        run: test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Secret SUPABASE_ACCESS_TOKEN is missing"; exit 1)

      - name: Normalize project ref
        id: ref
        run: bash .github/scripts/normalize-supabase-ref.sh

      - name: Detect database SQL changes
        id: db_changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi

          # Shallow/race after concurrent merges: before SHA may not exist locally.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::Base commit $BASE missing locally; treating SQL as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" "$GITHUB_SHA" -- \
            'supabase/migrations/**/*.sql' \
            'supabase/migrations/*.sql' \
            'supabase/migrations_client_config/**/*.sql' \
            'supabase/migrations_client_config/*.sql' \
            'scripts/*.sql' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 1) Edge functions — сначала и всегда (не зависят от пароля БД).
      #    Одна упавшая функция не роняет остальные и НЕ блокирует SQL ниже:
      #    раньше exit 1 здесь пропускал миграции (dm_button_title и т.п.).
      - name: Deploy edge functions
        id: functions
        continue-on-error: true
        env:
          SUPABASE_PROJECT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          FUNCS=$(ls supabase/functions | grep -v '^_' | tr '\n' ' ')
          echo "Deploying: $FUNCS"
          FAILED=""
          for fn in $FUNCS; do
            echo "::group::Deploying $fn"
            if ! supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "::warning::Failed to deploy $fn"
              FAILED="$FAILED $fn"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
            echo "::error::Some functions failed to deploy:$FAILED"
            exit 1
          fi
          echo "failed=" >> "$GITHUB_OUTPUT"

      # 2) Миграции БД — через db push если есть пароль.
      #    КРИТИЧНО: шаг идёт даже если functions упали (колонки вроде dm_button_title).
      - name: Apply database migrations
        id: db_push
        if: ${{ always() && steps.db_changes.outputs.changed == 'true' && env.SUPABASE_DB_PASSWORD != '' }}
        continue-on-error: true
        env:
          SUPABASE_PROJECT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      # 2b) Fallback: без пароля пробуем Management API (нужен scope database_write).
      - name: Apply critical SQL via Management API
        if: ${{ always() && steps.db_changes.outputs.changed == 'true' && env.SUPABASE_DB_PASSWORD == '' }}
        continue-on-error: true
        id: mgmt_sql
        env:
          SUPABASE_PROJECT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          chmod +x .github/scripts/apply-sql-via-management-api.sh
          FAILED=""
          for SQL_FILE in \
            scripts/apply-prod-pending-20260719.sql \
            scripts/apply-prod-cabinets-client-configs.sql \
            scripts/apply-ad-cabinets-project-member-write.sql \
            scripts/apply-client-configs-yurcha-sync.sql \
            scripts/apply-fix-project-delete-leads-pipeline-fk.sql \
            supabase/migrations/20260719190000_ig_dm_button_title.sql \
            supabase/migrations/20260719193000_montage_jobs_broll_source.sql \
            supabase/migrations/20260823120000_wa_web_block_greenapi_fix.sql \
            scripts/apply-wa-web-greenapi-fix.sql
          do
            echo "::group::Apply $SQL_FILE"
            if ! SQL_FILE="$SQL_FILE" .github/scripts/apply-sql-via-management-api.sh; then
              echo "::warning::Failed to apply $SQL_FILE"
              FAILED="$FAILED $SQL_FILE"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::warning::Some SQL files were not applied:$FAILED"
            exit 1
          fi

      - name: Note about DB migration status
        if: ${{ always() }}
        run: |
          if [ "${{ steps.db_changes.outputs.changed }}" != "true" ]; then
            echo "::notice::No database SQL changes in this push."
          elif [ "${{ steps.db_push.outcome }}" = "success" ] || [ "${{ steps.mgmt_sql.outcome }}" = "success" ]; then
            echo "::notice::Database SQL applied."
          else
            echo "::warning::Could not apply DB migration automatically (need SUPABASE_DB_PASSWORD or ACCESS_TOKEN with database_write). Apply scripts/apply-prod-pending-20260719.sql in Supabase SQL Editor."
          fi

      - name: Fail if functions or SQL did not succeed
        if: ${{ always() }}
        run: |
          FAIL=0
          if [ "${{ steps.functions.outcome }}" != "success" ]; then
            echo "::error::Edge function deploy had failures:${{ steps.functions.outputs.failed }}"
            FAIL=1
          fi
          SQL_OK=0
          if [ "${{ steps.db_changes.outputs.changed }}" != "true" ] || [ "${{ steps.db_push.outcome }}" = "success" ] || [ "${{ steps.mgmt_sql.outcome }}" = "success" ]; then
            SQL_OK=1
          fi
          # SQL is required only when SQL files changed or the workflow was started manually.
          if [ "$SQL_OK" != "1" ]; then
            echo "::error::Database migration did not apply."
            FAIL=1
          fi
          exit $FAIL

# redeploy trigger: dm_button_title must apply even when some functions fail
# retry after owner-token update
