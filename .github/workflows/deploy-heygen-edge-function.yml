# Деплой HeyGen/Telegram edge functions (раздел «Монтаж» + Telegram-бот).
# Секреты Supabase → Edge Functions → Secrets:
#   HEYGEN_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, TELEGRAM_BOT_USERNAME.
name: Deploy HeyGen edge function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/heygen-proxy/**"
      - "supabase/functions/heygen-telegram-link/**"
      - "supabase/functions/telegram-heygen/**"
      - "supabase/functions/heygen-jobs-worker/**"
      - "supabase/functions/_lib/auth.ts"
      - ".github/workflows/deploy-heygen-edge-function.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-heygen-edge-function
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'szfgdruhlebfvcmlvxdk' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify secrets
        run: |
          set -e
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::SUPABASE_ACCESS_TOKEN missing"; exit 1)

      - name: Normalize project ref
        id: ref
        run: bash .github/scripts/normalize-supabase-ref.sh

      - name: Deploy functions
        env:
          SUPABASE_PROJECT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -e
          for fn in \
            heygen-proxy \
            heygen-telegram-link \
            telegram-heygen \
            heygen-jobs-worker; do
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            echo "::endgroup::"
          done
