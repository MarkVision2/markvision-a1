# Выкат фронта на Vercel Production через CLI (обход Git rate-limit / Hobby).
# Нужны секреты: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Git-деплои жгут квоту Hobby (100/сутки) — в vercel.json стоит ignoreCommand
# (собирать только коммиты с тегом [vercel-deploy]).
name: Deploy frontend (Vercel)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "api/**"
      - "index.html"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/deploy-frontend-vercel.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check VERCEL_TOKEN
        id: tok
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN secret missing — CLI deploy skipped. Production still deploys via Vercel Git integration on [vercel-deploy]."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Hobby: Vercel отклоняет деплои, если author коммита ≠ владелец аккаунта.
      - name: Override commit author for Hobby plan
        env:
          VERCEL_DEPLOY_EMAIL: ${{ secrets.VERCEL_DEPLOY_EMAIL }}
          VERCEL_DEPLOY_NAME: ${{ secrets.VERCEL_DEPLOY_NAME }}
        run: |
          EMAIL="${VERCEL_DEPLOY_EMAIL:-admin@markvision.kz}"
          NAME="${VERCEL_DEPLOY_NAME:-MarkVision AI}"
          git config user.email "$EMAIL"
          git config user.name "$NAME"
          git commit --amend --no-edit --author="$NAME <$EMAIL>" || true

      - name: Pull Vercel project settings
        id: vercel_pull
        continue-on-error: true
        if: ${{ steps.tok.outputs.present == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      # Hobby CLI pins may reject project nodeVersion 24.x — force 22.x locally.
      - name: Force Node 22 for CLI build
        if: ${{ steps.vercel_pull.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path(".vercel/project.json")
          d = json.loads(p.read_text())
          d.setdefault("settings", {})["nodeVersion"] = "22.x"
          p.write_text(json.dumps(d, indent=2) + "\n")
          print("nodeVersion=", d["settings"]["nodeVersion"])
          PY

      - name: Build
        if: ${{ steps.vercel_pull.outcome == 'success' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        id: deploy
        if: ${{ steps.vercel_pull.outcome == 'success' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      # Раньше прогон был зелёным, даже когда не выкатывалось ничего: `vercel pull`
      # стоит под continue-on-error, поэтому его conclusion — success, а outcome —
      # failure, и три шага деплоя тихо пропускались. Изменения оставались в репозитории
      # и в Lovable, но на домен не уезжали, и по CI это было не видно.
      - name: Fail if nothing reached production
        if: ${{ always() }}
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "::notice::Выкачено через Vercel CLI."
            exit 0
          fi
          if git log -1 --pretty=%B | grep -q '\[vercel-deploy\]'; then
            echo "::notice::CLI-деплой не отработал, но в сообщении коммита есть [vercel-deploy] — соберёт Git-интеграция Vercel."
            exit 0
          fi
          echo "::error::Фронт не выкатился ни одним путём. CLI-деплой не отработал (проверьте секреты VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID), а в сообщении коммита нет метки [vercel-deploy], из-за чего ignoreCommand в vercel.json заставил Git-интеграцию пропустить сборку."
          exit 1
