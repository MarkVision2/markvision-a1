# Выкат фронта на Vercel Production через CLI (обход Git rate-limit / Hobby).
# Нужны секреты: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Git-деплои жгут квоту Hobby (100/сутки) — в vercel.json стоит ignoreCommand
# (собирать только коммиты с тегом [vercel-deploy]).
name: Deploy frontend (Vercel)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "api/**"
      - "index.html"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/deploy-frontend-vercel.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check VERCEL_TOKEN
        id: tok
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::VERCEL_TOKEN secret missing — www.markvision.kz не обновится через CLI."
            echo "::error::Добавь VERCEL_TOKEN (+ VERCEL_ORG_ID, VERCEL_PROJECT_ID) в GitHub Actions secrets."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Hobby: Vercel отклоняет деплои, если author коммита ≠ владелец аккаунта.
      - name: Override commit author for Hobby plan
        env:
          VERCEL_DEPLOY_EMAIL: ${{ secrets.VERCEL_DEPLOY_EMAIL }}
          VERCEL_DEPLOY_NAME: ${{ secrets.VERCEL_DEPLOY_NAME }}
        run: |
          EMAIL="${VERCEL_DEPLOY_EMAIL:-admin@markvision.kz}"
          NAME="${VERCEL_DEPLOY_NAME:-MarkVision AI}"
          git config user.email "$EMAIL"
          git config user.name "$NAME"
          git commit --amend --no-edit --author="$NAME <$EMAIL>" || true

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@39.4.2 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@39.4.2 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@39.4.2 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
