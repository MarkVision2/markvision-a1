name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install ripgrep (verify-audit-plan.sh)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: npm ci
      - run: npm run ci
