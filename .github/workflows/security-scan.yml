name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/react \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --error \
            --severity=ERROR \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=.agents \
            --exclude=supabase/migrations \
            --metrics=off

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production deps - fail on critical
        run: npm audit --audit-level=critical --omit=dev
      - name: All deps - warn on high
        if: always()
        run: npm audit --audit-level=high || echo "::warning::npm audit found high-severity issues; review when possible"
