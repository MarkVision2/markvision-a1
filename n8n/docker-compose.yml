services:
  traefik:
    image: "traefik"
    restart: always
    command:
      - "--api=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    image: n8n-with-ffmpeg:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge

      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true

      - traefik.http.routers.n8n.middlewares=n8n@docker,n8n-nobuffer@docker
      - traefik.http.middlewares.n8n-nobuffer.headers.customResponseHeaders.X-Accel-Buffering=no

    environment:
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_TRUSTED_PROXIES=true

      # --- v2.0 fixes: Execute Command + custom nodes ---
      - N8N_ALLOW_EXECUTE_COMMAND=true
      - N8N_ENABLE_NODE_DEV=true
      - NODES_EXCLUDE=
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # --- v2.0 fixes: Read/Write File access ---
      # Whitelist paths the filesystem nodes are allowed to touch.
      # Both /videos and /home/node/.n8n-files map to the same host folder
      # via the volumes section below, so we allow both.
      - N8N_FILESYSTEM_PATH_WHITELIST=/videos:/home/node/.n8n-files
      - N8N_RESTRICT_FILE_ACCESS_TO=/videos:/home/node/.n8n-files:/files:/tmp

    volumes:
      - n8n_data:/home/node/.n8n
      - ./videos:/home/node/.n8n-files
      - ./videos:/videos
      - /local-files:/files
      - /usr/share/fonts:/usr/share/fonts

volumes:
  traefik_data:
    external: true
  n8n_data:
    external: true
